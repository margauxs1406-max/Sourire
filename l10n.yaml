# Configuration de la generation des traductions (flutter gen-l10n).
# Les fichiers generes sont committes dans lib/l10n/ : c'est ce que le code
# importe (package:sourire/l10n/app_localizations.dart).
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
