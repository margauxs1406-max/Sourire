name: sourire
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+12

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  wechat_assets_picker: ^9.1.0
  cupertino_icons: ^1.0.8
  drop_shadow: ^0.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  local_auth: ^3.0.1 
  flutter_localizations:
    sdk: flutter
  tutorial_coach_mark: ^1.3.3
  # AJOUT : Indispensable pour lire et colorer vos icônes SVG
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^17.0.0 # Vérifie la dernière version stable
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0 # Fuseau horaire IANA réel de l'appareil (rappels à la bonne heure)
  permission_handler: ^11.3.1 # <-- AJOUTE CETTE LIGNE
  # Redimensionnement des photos à l'import (lib/services/photo_service.dart).
  image: ^4.8.0
  shared_preferences: ^2.3.5 # <-- AJOUT : Stockage persistant des réglages
  sqflite: ^2.4.0   # Gère la base de données SQLite
  path: ^1.9.1      # Gère la création sécurisée des chemins de fichiers sur le téléphone
  sensors_plus: ^6.0.0
  url_launcher: ^6.3.0
  device_info_plus: ^11.0.0
  # Partage d'un souvenir en image, via la feuille système.
  # Volontairement en 12.x : la 13 impose win32 ^6, incompatible avec
  # device_info_plus 11. L'API utilisée (SharePlus.instance.share) est
  # identique depuis la 11, la 13 n'apportait qu'un bump de dépendances.
  share_plus: ^12.0.2
  # Sauvegarde : archive zip du bocal + sélecteur de fichier pour la relire.
  archive: ^4.0.0
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  simple_shadow: ^0.3.1  # <-- Ajoutez cette ligne ici
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FF8C00"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/badges/
    - assets/bibliotheque/
    - assets/themes/abstrait/
    - assets/themes/animaux_marins/
    - assets/themes/cinema/
    - assets/themes/kawaii/
    - assets/themes/floral/
    - assets/themes/mer/
    - assets/themes/montagne/
    - assets/themes/musique/
    - assets/themes/sport/

  fonts:
    # Police d'interface, posée par défaut UNIQUEMENT sur Android (voir
    # main.dart) : iOS garde San Francisco, qui y est plus juste.
    - family: Inclusive Sans
      fonts:
        - asset: assets/fonts/inclusive-sans-latin-400-normal.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-VariableFont_wght.ttf
    - family: Spicy Rice
      fonts:
        - asset: assets/fonts/SpicyRice-Regular.ttf