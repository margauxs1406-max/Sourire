name: sourire
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  wechat_assets_picker: ^9.1.0
  cupertino_icons: ^1.0.8
  drop_shadow: ^0.1.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  local_auth: ^3.0.1 
  flutter_localizations:
    sdk: flutter
  tutorial_coach_mark: ^1.3.3
  device_preview: ^1.3.1
  # AJOUT : Indispensable pour lire et colorer vos icônes SVG
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^17.0.0 # Vérifie la dernière version stable
  timezone: ^0.9.4
  permission_handler: ^11.3.1 # <-- AJOUTE CETTE LIGNE
  image: ^4.8.0
  shared_preferences: ^2.3.5 # <-- AJOUT : Stockage persistant des réglages
  sqflite: ^2.4.0   # Gère la base de données SQLite
  path: ^1.9.1      # Gère la création sécurisée des chemins de fichiers sur le téléphone
  sensors_plus: ^6.0.0
  url_launcher: ^6.3.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  simple_shadow: ^0.3.1  # <-- Ajoutez cette ligne ici

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/badges/
    - assets/bibliotheque/
    - assets/themes/abstrait/
    - assets/themes/animaux_marins/
    - assets/themes/cinema/
    - assets/themes/kawaii/
    - assets/themes/floral/
    - assets/themes/mer/
    - assets/themes/montagne/
    - assets/themes/musique/
    - assets/themes/sport/

  fonts:
    - family: Lobster Two
      fonts:
        - asset: assets/fonts/LobsterTwo-Regular.ttf
          style: italic
    - family: Spicy Rice
      fonts:
        - asset: assets/fonts/SpicyRice-Regular.ttf